 <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF2E97"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="barWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7B5CFF" fill-opacity="0.25"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 24" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="10" y="10" width="980" height="540" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="980" height="540" fill="#070a1a"/>
    <rect x="10" y="10" width="980" height="540" fill="url(#dots)"/>
    <rect x="10" y="-80" width="980" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;560" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Barra de titulo -->
    <text x="40" y="46" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" fill="#00E5FF" letter-spacing="3" filter="url(#glow)">◢ PLAYER PROFILE // cxrls7</text>
    <circle cx="880" cy="41" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="960" y="46" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#86efac" letter-spacing="2">ONLINE</text>
    <line x1="30" y1="62" x2="970" y2="62" stroke="url(#neon)" stroke-width="2"/>
    <circle r="4" cy="62" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="30;970;30" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Avatar -->
    <g>
      <polygon points="185,55 267.3,102.5 267.3,197.5 185,245 102.7,197.5 102.7,102.5" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="10 8" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 185 150" to="360 185 150" dur="20s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="185,70 254.3,110 254.3,190 185,230 115.7,190 115.7,110" fill="#0d1233" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
      <text x="185" y="170" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="url(#neon)" filter="url(#glow)">CM</text>
      <circle r="5" fill="#FF2E97" filter="url(#glow)">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 185,55 L 267.3,102.5 L 267.3,197.5 L 185,245 L 102.7,197.5 L 102.7,102.5 Z"/>
      </circle>
    </g>

    <!-- Datos del jugador -->
    <g font-family="'Courier New', Consolas, monospace">
      <text x="185" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">CARLOS MOLINA</text>
      <text x="185" y="304" text-anchor="middle" font-size="13" fill="#a5b4fc" letter-spacing="1">CLASE: FULL STACK </text>
      <text x="185" y="326" text-anchor="middle" font-size="13" fill="#7dd3fc" letter-spacing="1">GREMIO: RIWI</text>
      <text x="185" y="348" text-anchor="middle" font-size="13" fill="#7dd3fc" letter-spacing="1">ZONA: BARRANQUILLA, CO</text>
      <text x="185" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#FF2E97" letter-spacing="2">
        ▸ NIVEL: SIEMPRE SUBIENDO
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Atributos -->
    <text x="380" y="100" font-family="'Courier New', Consolas, monospace" font-size="16" font-weight="700" fill="#FF2E97" letter-spacing="3">▌ ATRIBUTOS</text>
    <g font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0" letter-spacing="1">
      <text x="380" y="142">C#</text>
      <text x="380" y="182">.NET</text>
      <text x="380" y="222">BASES DE DATOS</text>
      <text x="380" y="262">APIs REST</text>
      <text x="380" y="302">ANGULAR//REACT</text>
      <text x="380" y="342">INGLÉS</text>
    </g>
    <g fill="#141a3d">
      <rect x="520" y="130" width="380" height="16" rx="8"/>
      <rect x="520" y="170" width="380" height="16" rx="8"/>
      <rect x="520" y="210" width="380" height="16" rx="8"/>
      <rect x="520" y="250" width="380" height="16" rx="8"/>
      <rect x="520" y="290" width="380" height="16" rx="8"/>
      <rect x="520" y="330" width="380" height="16" rx="8"/>
    </g>
    <g filter="url(#glow)">
      <rect x="520" y="130" width="0" height="16" rx="8" fill="url(#bar)">
        <animate attributeName="width" values="0;350;350;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
      </rect>
      <rect x="520" y="170" width="0" height="16" rx="8" fill="url(#bar)">
        <animate attributeName="width" values="0;334;334;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
      </rect>
      <rect x="520" y="210" width="0" height="16" rx="8" fill="url(#bar)">
        <animate attributeName="width" values="0;342;342;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
      </rect>
      <rect x="520" y="250" width="0" height="16" rx="8" fill="url(#bar)">
        <animate attributeName="width" values="0;338;338;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
      </rect>
      <rect x="520" y="290" width="0" height="16" rx="8" fill="url(#barWarm)">
        <animate attributeName="width" values="0;312;312;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
      </rect>
      <rect x="520" y="330" width="0" height="16" rx="8" fill="url(#barWarm)">
  <animate attributeName="width" values="0;342;342;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;.4 0 .2 1"/>
</rect>
    </g>
    <g font-family="'Courier New', Consolas, monospace" font-size="13" fill="#7dd3fc" text-anchor="end">
      <text x="960" y="143">92%</text>
      <text x="960" y="183">88%</text>
      <text x="960" y="223">90%</text>
      <text x="960" y="263">89%</text>
      <text x="960" y="303">82%</text>
      <text x="960" y="343">90%</text>
    </g>

    <!-- Tarjeta 1: mision principal -->
    <g>
      <rect x="30" y="395" width="300" height="140" rx="12" fill="#0b0f24" stroke="#2a2f5a" stroke-width="1.5"/>
      <rect x="30" y="395" width="60" height="3" fill="#00E5FF">
        <animate attributeName="x" values="30;270;30" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="48" y="424" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#00E5FF" letter-spacing="2">◆ MISIÓN PRINCIPAL</text>
      <g font-family="'Courier New', Consolas, monospace" font-size="14" fill="#e2e8f0">
        <text x="48" y="452">Convertirme en desarrollador</text>
        <text x="48" y="472">profesional y construir</text>
        <text x="48" y="492">proyectos reales</text>
      </g>
      <rect x="48" y="508" width="264" height="10" rx="5" fill="#141a3d"/>
      <rect x="48" y="508" width="0" height="10" rx="5" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Tarjeta 2: misiones secundarias -->
    <g>
      <rect x="350" y="395" width="300" height="140" rx="12" fill="#0b0f24" stroke="#2a2f5a" stroke-width="1.5"/>
      <rect x="350" y="395" width="60" height="3" fill="#8B5CF6">
        <animate attributeName="x" values="350;590;350" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="368" y="424" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#8B5CF6" letter-spacing="2">◆ MISIONES SECUNDARIAS</text>
      <g font-family="'Courier New', Consolas, monospace" font-size="14" fill="#e2e8f0">
        <text x="368" y="456">▸ Seguir mejorando 
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
        </text>
        <text x="368" y="482">▸ Ser senior
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </text>
        <text x="368" y="508">▸ Trabajar en una empresa
          <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- Tarjeta 3: inventario -->
    <g>
      <rect x="670" y="395" width="300" height="140" rx="12" fill="#0b0f24" stroke="#2a2f5a" stroke-width="1.5"/>
      <rect x="670" y="395" width="60" height="3" fill="#FF2E97">
        <animate attributeName="x" values="670;910;670" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="688" y="424" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#FF2E97" letter-spacing="2">◆ INVENTARIO</text>
      <g font-family="'Courier New', Consolas, monospace" font-size="14" fill="#e2e8f0">
        <text x="688" y="456">▸ Videojuegos </text>
        <text x="688" y="482">▸ Viajar por el mundo</text>
        <text x="688" y="508">▸ Proyectos reales</text>
      </g>
      <circle cx="948" cy="418" r="5" fill="#FF2E97">
        <animate attributeName="r" values="3;7;3" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Marco -->
  <rect x="10" y="10" width="980" height="540" rx="18" fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-dasharray="16 8" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
