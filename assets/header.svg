<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Carlos Molina - Desarrollador C# y .NET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="360" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF2E97"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.8" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#1a1145"/>
      <stop offset="0.6" stop-color="#080a1c"/>
      <stop offset="1" stop-color="#03040c"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7B5CFF" stroke-opacity="0.22" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;9;3" dur="2.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="60" y="145" width="0" height="34">
        <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.3;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Fondo -->
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- Barrido de escaner -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;300" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Particulas ascendentes -->
    <g fill="#00E5FF">
      <circle cx="90" cy="310" r="2"><animate attributeName="cy" values="310;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="310" r="1.5" fill="#FF2E97"><animate attributeName="cy" values="310;-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="310" r="2"><animate attributeName="cy" values="310;-10" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="310" r="1.5" fill="#8B5CF6"><animate attributeName="cy" values="310;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="310" r="2"><animate attributeName="cy" values="310;-10" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="310" r="1.5" fill="#FF2E97"><animate attributeName="cy" values="310;-10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="310" r="2" fill="#8B5CF6"><animate attributeName="cy" values="310;-10" dur="6.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="310" r="2"><animate attributeName="cy" values="310;-10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Esquinas HUD -->
    <g fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round">
      <path d="M20 50V20H50"/><path d="M950 20H980V50"/><path d="M20 250V280H50"/><path d="M950 280H980V250"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- Etiqueta superior -->
    <text x="60" y="62" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#7dd3fc" letter-spacing="3">
      [ cxrls7 ] // BOOT SEQUENCE OK
      <animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;0.7;0.75;0.8;1" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- Titulo con glitch -->
    <text x="60" y="125" font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" font-size="60" font-weight="900" fill="#00E5FF" textLength="590" lengthAdjust="spacingAndGlyphs" opacity="0">
      CARLOS MOLINA
      <animate attributeName="x" values="60;60;54;66;60;60" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="125" font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" font-size="60" font-weight="900" fill="#FF2E97" textLength="590" lengthAdjust="spacingAndGlyphs" opacity="0">
      CARLOS MOLINA
      <animate attributeName="x" values="60;60;66;54;60;60" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="125" font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" font-size="60" font-weight="900" fill="url(#neon)" filter="url(#glow)" textLength="590" lengthAdjust="spacingAndGlyphs">
      CARLOS MOLINA
    </text>

    <!-- Subtitulo que se escribe -->
    <g clip-path="url(#typeClip)">
      <text x="60" y="170" font-family="'Courier New', Consolas, monospace" font-size="21" font-weight="700" fill="#e2e8f0" textLength="560" lengthAdjust="spacing">&gt; DESARROLLADOR C# · .NET · FULL STACK</text>
    </g>
    <rect y="150" width="10" height="24" fill="#00E5FF">
      <animate attributeName="x" values="60;620;620;60" keyTimes="0;0.3;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Frases rotativas -->
    <g font-family="'Courier New', Consolas, monospace" font-size="16" fill="#a5b4fc" letter-spacing="2">
      <text x="60" y="212" opacity="1">// BACKEND · APIs · POSTGRESQL
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="212" opacity="0">// APRENDIENDO PYTHON + INGLÉS
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="212" opacity="0">// GAMER · VIAJERO · CONSTRUCTOR
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Estado -->
    <circle cx="66" cy="268" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="273" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#86efac" letter-spacing="2">SYSTEM ONLINE // BARRANQUILLA, CO</text>

    <!-- Nucleo orbital -->
    <g>
      <circle cx="830" cy="150" r="118" fill="none" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 12">
        <animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="150" r="98" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="90 40 20 40" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="360 830 150" to="0 830 150" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="150" r="78" fill="none" stroke="#FF2E97" stroke-width="2" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="8s" repeatCount="indefinite"/>
      </circle>
      <polygon points="830,86 885.4,118 885.4,182 830,214 774.6,182 774.6,118" fill="#0b0f2a" fill-opacity="0.85" stroke="#00E5FF" stroke-width="2" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0 830 150" to="360 830 150" dur="30s" repeatCount="indefinite"/>
      </polygon>
      <text x="830" y="168" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="54" font-weight="900" fill="#ffffff" filter="url(#glowPulse)">C#</text>
      <text x="830" y="198" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="15" font-weight="700" fill="#00E5FF" letter-spacing="3">.NET</text>

      <!-- Satelites -->
      <circle r="6" fill="#00E5FF" filter="url(#glow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M 712,150 a 118,118 0 1,0 236,0 a 118,118 0 1,0 -236,0"/>
      </circle>
      <circle r="4" fill="#FF2E97" filter="url(#glow)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M 732,150 a 98,98 0 1,1 196,0 a 98,98 0 1,1 -196,0"/>
      </circle>
    </g>
  </g>

  <!-- Marco -->
  <rect x="1" y="1" width="998" height="298" rx="16" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="14 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
