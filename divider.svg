<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="30" viewBox="0 0 1000 30" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="0.75" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="14" width="1000" height="2" fill="url(#line)"/>
  <rect x="-160" y="13" width="160" height="4" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" values="-160;1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(500 15)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" fill="#0b0f24" stroke="#00E5FF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.5" fill="#FF2E97">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
